<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="256" height="256" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#2c3e50" stroke="#34495e" stroke-width="4"/>
  
  <!-- Shield shape -->
  <path d="M 128 40 L 180 70 L 180 130 Q 180 180 128 220 Q 76 180 76 130 L 76 70 Z" 
        fill="url(#grad1)" stroke="#a00000" stroke-width="3"/>
  
  <!-- X symbol (representing wipe/delete) -->
  <g transform="translate(128, 128)">
    <!-- First diagonal line -->
    <rect x="-40" y="-8" width="80" height="16" fill="white" transform="rotate(45)"/>
    <!-- Second diagonal line -->
    <rect x="-40" y="-8" width="80" height="16" fill="white" transform="rotate(-45)"/>
  </g>
  
  <!-- Lock symbol at bottom -->
  <g transform="translate(128, 180)">
    <rect x="-12" y="-8" width="24" height="20" fill="white" rx="2"/>
    <path d="M -8 -8 L -8 -12 Q -8 -20 0 -20 Q 8 -20 8 -12 L 8 -8" 
          stroke="white" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Text "VW" at top -->
  <text x="128" y="85" font-family="Arial, sans-serif" font-size="24" 
        font-weight="bold" fill="white" text-anchor="middle">VW</text>
</svg>
